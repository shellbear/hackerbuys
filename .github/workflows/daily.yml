# Adds each new day of Hacker News comments, then starts the Deploy workflow, which builds and publishes the site.
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN, created with `claude setup-token` on a machine logged in to the subscription.
name: Daily update

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      lag:
        description: "Days to wait before a day counts as complete"
        default: "2"

permissions:
  contents: write
  actions: write # to start the Deploy workflow

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Actions and the CLI are pinned: this job holds push access and the subscription token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # the push token is added only in the last step, not while comments are processed
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.318
      - run: uv sync --frozen

      - name: Fetch, queue and extract new days
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LAG: ${{ inputs.lag || '2' }}
        run: uv run python scripts/31_daily.py --no-site --lag "$LAG"

      - name: Commit the new data, push, deploy
        env:
          PUSH_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # failed.log is also appended to by local runs, so it stays out of these commits to keep the rebase clean.
          git add corpus/daily extract/out ':!extract/out/failed.log'
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "Daily update $(ls corpus/daily | tail -1 | cut -c1-10)"
          git checkout -q -- extract/out/failed.log 2>/dev/null || true
          # The data only adds files, so it rebases cleanly.
          for attempt in 1 2 3; do
            git pull -q --rebase origin main
            # A push made with this token doesn't start other workflows, so the deploy is started explicitly.
            git push -q origin HEAD:main && exec gh workflow run deploy.yml --ref main
          done
          exit 1
