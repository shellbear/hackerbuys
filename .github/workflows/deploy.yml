# Builds the site from the committed data and deploys it to Cloudflare. Generated pages are not in git.
# Runs on every push to main, and when the daily update dispatches it after adding new data.
# Needs the repository secrets CLOUDFLARE_API_TOKEN (the "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to commit state/lastmod.json back

# One deploy at a time, never cancelled halfway through an upload. Each run builds the newest main, so the last one wins.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions and wrangler are pinned: this job holds push access and the Cloudflare token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: uv sync --frozen

      - name: Test
        run: |
          uv run python -m unittest discover -s tests
          node --test tests/site_sort.test.cjs

      - name: Build
        run: uv run python scripts/14_build_site.py

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.159.0 deploy

      # Page dates only move when a page's text changes, so the build needs the last ones. They live in git.
      - name: Save page dates
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git add state/lastmod.json
          if git diff --cached --quiet; then echo "no page changed"; exit 0; fi
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Update page dates"
          # Pushes made with this token don't start another deploy.
          for attempt in 1 2 3; do
            git push -q origin HEAD:main && exit 0
            git pull -q --rebase origin main
          done
          exit 1
