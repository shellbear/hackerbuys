# Temporary: checks the CLAUDE_CODE_OAUTH_TOKEN secret with one tool-free Haiku call. Remove after it passes.
name: Token check
on:
  push:
    branches: [extraction-pipeline]
    paths: [.github/workflows/token-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.318
      - env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo '{"x":1}' | claude -p --model claude-haiku-5-5 --effort low --tools "" --output-format json --no-session-persistence \
            --strict-mcp-config --setting-sources "" --disable-slash-commands --system-prompt "Reply with the single word ok." \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['subtype'], d.get('is_error'), repr(d.get('result')), d['modelUsage'].keys()); sys.exit(1 if d.get('is_error') else 0)"
